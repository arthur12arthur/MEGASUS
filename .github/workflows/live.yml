name: Surveillance du marche

# Mode vivant : releve les cotes directes PMU jusqu'a ~12 min avant le depart et envoie un
# message Telegram court si l'ordre change. Automatique : un controle toutes les 30 min
# (08h-20h UTC) ; la surveillance ne demarre que dans les 2h30 avant le depart de la course
# du jour, donc aucun run inutile. Lancement manuel possible (demarre tout de suite).

on:
  schedule:
    # Minutes decalees a dessein (GitHub retarde les cron a l'heure pile).
    - cron: "3,33 8-20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "reel = envoie sur Telegram ; simulation = n'envoie rien"
        required: false
        default: "simulation"

# Groupe a part : un run de surveillance long ne doit pas bloquer l'analyse ni l'evaluation.
concurrency:
  group: hyperion-live
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  surveillance:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Course du jour dans la fenetre de surveillance ?
        id: fenetre
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, glob, json, os
          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              print("go=true"); raise SystemExit
          now = dt.datetime.now(dt.timezone.utc)
          go = False
          for f in sorted(glob.glob(f"data/runs/{now:%Y}/{now:%m}/{now:%d}/*.json")):
              try:
                  rec = json.load(open(f, encoding="utf-8"))
                  depart = dt.datetime.fromisoformat(rec["meta"]["start_time"])
              except Exception:
                  continue
              mins = (depart - now).total_seconds() / 60
              if 12 < mins <= 150:
                  go = True
          print("go=" + ("true" if go else "false"))
          PY
      - uses: actions/setup-python@v5
        if: steps.fenetre.outputs.go == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - name: Installer
        if: steps.fenetre.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Surveiller
        if: steps.fenetre.outputs.go == 'true'
        env:
          HYPERION_DRY_RUN: ${{ (github.event_name == 'schedule' || github.event.inputs.mode == 'reel') && 'false' || 'true' }}
          HYPERION_PLATFORM_NAME: "Hyperion V1 (GitHub Actions)"
          HYPERION_TELEGRAM_TOKEN: ${{ secrets.HYPERION_TELEGRAM_TOKEN }}
          HYPERION_TELEGRAM_CHAT_ID: ${{ secrets.HYPERION_TELEGRAM_CHAT_ID }}
        run: python -m hyperion.cli watch
      - name: Committer la trace
        if: always() && steps.fenetre.outputs.go == 'true'
        run: |
          git config user.name "hyperion-bot"
          git config user.email "hyperion-bot@users.noreply.github.com"
          for d in data/live; do [ -e "$d" ] && git add -A "$d"; done; true
          if git diff --cached --quiet; then echo "Rien a committer."; else
            git commit -m "chore(live): releves du $(date -u +%F)"
            git pull --rebase -q origin main || true
            git push
          fi
