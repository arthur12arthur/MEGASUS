name: Collecte historique PMU

# Telecharge des courses PASSEES (partants + arrivee officielle) dans data/history/
# pour le backtesting. Lancement manuel : Actions > Collecte historique PMU.

on:
  workflow_dispatch:
    inputs:
      date_from:
        description: "Premier jour (AAAA-MM-JJ)"
        required: true
      date_to:
        description: "Dernier jour (AAAA-MM-JJ)"
        required: true
      scope:
        description: "quinte | france | all"
        required: false
        default: "france"

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer
        run: pip install -e . requests
      - name: Collecter
        run: python -m hyperion.cli collect-history --from "${{ inputs.date_from }}" --to "${{ inputs.date_to }}" --scope "${{ inputs.scope }}"
      - name: Committer l'historique
        if: always()
        run: |
          git config user.name "hyperion-bot"
          git config user.email "hyperion-bot@users.noreply.github.com"
          git add -A data/history || true
          if git diff --cached --quiet; then echo "Rien a committer."; else
            git commit -m "chore(history): collecte ${{ inputs.date_from }} -> ${{ inputs.date_to }}"
            git pull --rebase -q origin main || true
            git push
          fi
