name: Analyse quotidienne

# Analyse automatique de la course du jour, puis evaluation du soir.
# Tout est gratuit : GitHub Actions, Telegram Bot API, SMTP Gmail.
#
# Secrets a renseigner dans Settings > Secrets and variables > Actions :
#   HYPERION_TELEGRAM_TOKEN   token du bot Telegram
#   HYPERION_TELEGRAM_CHAT_ID identifiant du chat destinataire
#   HYPERION_SMTP_HOST        ex. smtp.gmail.com
#   HYPERION_SMTP_USER        adresse Gmail
#   HYPERION_SMTP_PASSWORD    mot de passe d'application Gmail
#   HYPERION_MAIL_FROM        adresse d'expedition
#   HYPERION_MAIL_TO          adresse(s) destinataire(s), separees par des virgules
#   HYPERION_LONAB_URL        URL du journal officiel du jour
#   HYPERION_GEMINI_KEYS      cle(s) API Gemini, separees par des virgules
#   HYPERION_DRY_RUN          "true" uniquement pour simuler sans envoyer

on:
  schedule:
    # 09h30 UTC = 09h30 a Ouagadougou (UTC+0) = 10h30/11h30 a Paris.
    # Les courses sont francaises ; la limite est la cloture des enjeux LONAB
    # (environ 10 min avant le depart), affichee dans le rapport.
    - cron: "30 9 * * *"
    # 22h00 UTC : evaluation du soir sur l'arrivee officielle PMU (France).
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date a analyser (AAAA-MM-JJ, vide = aujourd'hui)"
        required: false
        default: ""
      dry_run:
        description: "Simulation sans Telegram (false = envoi réel par défaut)"
        required: false
        default: "false"
      telegram_test:
        description: "Envoyer un unique message de test Telegram réel"
        required: false
        default: "false"

concurrency:
  group: hyperion-daily
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installer l'extracteur PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Vérifier la configuration Telegram
        env:
          HYPERION_TELEGRAM_TOKEN: ${{ secrets.HYPERION_TELEGRAM_TOKEN }}
          HYPERION_TELEGRAM_CHAT_ID: ${{ secrets.HYPERION_TELEGRAM_CHAT_ID }}
        run: |
          test -n "$HYPERION_TELEGRAM_TOKEN" || (echo "Secret HYPERION_TELEGRAM_TOKEN absent"; exit 1)
          test -n "$HYPERION_TELEGRAM_CHAT_ID" || (echo "Secret HYPERION_TELEGRAM_CHAT_ID absent"; exit 1)
          curl --fail --silent --show-error "https://api.telegram.org/bot${HYPERION_TELEGRAM_TOKEN}/getMe" >/dev/null
          curl --fail --silent --show-error --get \
            --data-urlencode "chat_id=${HYPERION_TELEGRAM_CHAT_ID}" \
            "https://api.telegram.org/bot${HYPERION_TELEGRAM_TOKEN}/getChat" >/dev/null

      - name: Test réel Telegram (sur demande)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true'
        env:
          HYPERION_TELEGRAM_TOKEN: ${{ secrets.HYPERION_TELEGRAM_TOKEN }}
          HYPERION_TELEGRAM_CHAT_ID: ${{ secrets.HYPERION_TELEGRAM_CHAT_ID }}
        run: |
          curl --fail --silent --show-error --request POST \
            --data-urlencode "chat_id=${HYPERION_TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=Hyperion : test réel Telegram réussi — aucune analyse envoyée." \
            "https://api.telegram.org/bot${HYPERION_TELEGRAM_TOKEN}/sendMessage" >/dev/null

      - name: Analyse de la course du jour
        env:
          HYPERION_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          HYPERION_PLATFORM_NAME: "Hyperion V1 (GitHub Actions)"
          HYPERION_TELEGRAM_TOKEN: ${{ secrets.HYPERION_TELEGRAM_TOKEN }}
          HYPERION_TELEGRAM_CHAT_ID: ${{ secrets.HYPERION_TELEGRAM_CHAT_ID }}
          HYPERION_SMTP_HOST: ${{ secrets.HYPERION_SMTP_HOST }}
          HYPERION_SMTP_USER: ${{ secrets.HYPERION_SMTP_USER }}
          HYPERION_SMTP_PASSWORD: ${{ secrets.HYPERION_SMTP_PASSWORD }}
          HYPERION_MAIL_FROM: ${{ secrets.HYPERION_MAIL_FROM }}
          HYPERION_MAIL_TO: ${{ secrets.HYPERION_MAIL_TO }}
          HYPERION_LONAB_URL: ${{ secrets.HYPERION_LONAB_URL }}
          HYPERION_GEMINI_KEYS: ${{ secrets.HYPERION_GEMINI_KEYS }}
          HYPERION_HUMAN_PRESENT: "false"
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -f "data/runs/$(date -u +%Y)/$(date -u +%m)/$(date -u +%d)" ]; then
            echo "Une analyse existe deja pour aujourd'hui."
          fi
          if [ -f "data/journal_$(date -u +%F).json" ]; then
            python -m hyperion.cli run --input "data/journal_$(date -u +%F).json" \
              --panel "data/panel_$(date -u +%F).json" \
              --store --deliver
          else
            # Recuperation automatique du journal LONAB du jour (course reelle).
            # Pas de repli sur la demo synthetique : en cas d'echec, le job
            # echoue et le probleme est visible.
            if [ -n "$DATE" ]; then
              python -m hyperion.cli run --auto --date "$DATE" --store --deliver
            else
              python -m hyperion.cli run --auto --store --deliver
            fi
          fi

      - name: Evaluation du soir
        run: python -m hyperion.cli evaluate

      - name: Committer les resultats
        if: always()
        run: |
          git config user.name "hyperion-bot"
          git config user.email "hyperion-bot@users.noreply.github.com"
          git add -A data/runs || true
          if git diff --cached --quiet; then
            echo "Rien a committer."
          else
            git commit -m "chore(runs): analyse et evaluation du $(date -u +%F)"
            git push
          fi
