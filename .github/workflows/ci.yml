name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Installer les dependances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verifier la couverture d'import
        run: python -c "import hyperion; print('hyperion', hyperion.__version__)"

      - name: Lancer les tests
        run: python -m pytest -v --tb=short

      - name: Backtest de non-regression (40 courses synthetiques)
        run: python -m hyperion.cli backtest --n 40 --seed 2026
